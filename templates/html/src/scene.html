<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="neonix-document" content='{{NEONIX_DOCUMENT_META}}' />

    <style data-neonix-bundle>
      html,
      body {
        width: {{COMPOSITION_WIDTH}}px;
        height: {{COMPOSITION_HEIGHT}}px;
        margin: 0;
        overflow: hidden;
        background: {{COMPOSITION_BACKGROUND}};
      }

      .scene {
        position: relative;
        width: {{COMPOSITION_WIDTH}}px;
        height: {{COMPOSITION_HEIGHT}}px;
        overflow: hidden;
        background: {{COMPOSITION_BACKGROUND}};
      }

      #title {
        position: absolute;
        left: 240px;
        top: 360px;
        width: calc({{COMPOSITION_WIDTH}}px - 480px);
        color: #ffffff;
        font-family: Inter, sans-serif;
        font-size: 96px;
        font-weight: 700;
        text-align: center;
      }

    </style>
  </head>
  <body>
    <main class="scene" id="scene">
      <h1 id="title">Hello Neonix</h1>

    </main>
  </body>
</html>
